<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pips Storage</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .card { max-width:520px; width:100%; border:1px solid #30363d; border-radius:12px; padding:2rem; }
    h1 { margin-top:0; }
    p { color:#8b949e; line-height:1.5; }
    .actions { display:flex; gap:.75rem; flex-wrap:wrap; margin-top:1.5rem; }
    .btn { display:inline-block; background:#238636; color:#fff; border-radius:6px; padding:.6rem 1.1rem; text-decoration:none; }
    .btn.secondary { background:#21262d; border:1px solid #30363d; }
    .btn[aria-disabled="true"] { opacity:.5; pointer-events:none; }
    .note { font-size:.85rem; margin-top:1.25rem; }
    code { background:#161b22; padding:.1rem .35rem; border-radius:4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to Pips Storage</h1>
    <p>Upload and manage your files. Your files and account data are stored in a private repository.</p>
    <div class="actions">
      <a class="btn" id="login" href="__APP_URL__/login">Log in</a>
      <a class="btn secondary" id="signup" href="__APP_URL__/signup">Sign up</a>
    </div>
    <p class="note" id="note"></p>
  </div>
  <script>
    // If the app URL was not configured at build time, disable the buttons and say so.
    if (!"__APP_URL__") {
      for (const id of ["login", "signup"]) {
        const a = document.getElementById(id);
        a.removeAttribute("href"); a.setAttribute("aria-disabled", "true");
      }
      document.getElementById("note").textContent = "Log in and sign up are not available yet: the app server is not configured.";
    }
  </script>
</body>
</html>
