<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Pips Storage</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .card { max-width:420px; width:100%; border:1px solid #30363d; border-radius:12px; padding:2rem; }
    h1 { margin-top:0; }
    p { color:#8b949e; line-height:1.5; }
    label { display:block; margin:.9rem 0 .3rem; font-size:.9rem; color:#8b949e; }
    input { width:100%; background:#161b22; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:.55rem .7rem; font-size:1rem; }
    .btn { display:inline-block; background:#238636; color:#fff; border:0; border-radius:6px; padding:.6rem 1.1rem; text-decoration:none; font-size:1rem; cursor:pointer; margin-top:1.25rem; }
    .btn.secondary { background:#21262d; border:1px solid #30363d; }
    .btn[disabled], .btn[aria-disabled="true"] { opacity:.5; pointer-events:none; }
    .note { font-size:.9rem; margin-top:1rem; color:#d29922; }
    a { color:#58a6ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Log in</h1>
    <p>Log in on the app server to open your apps and files.</p><div class="actions"><a class="btn" data-app href="__APP_URL__/login">Continue to log in</a><a class="btn secondary" href="../signup/">Sign up</a></div><p><a href="../">Home</a></p>
    <p class="note" id="note"></p>
  </div>
  <script>
    // Forms and sessions live on the app server (cookies are tied to it). This page only links there.
    if (!"__APP_URL__") {
      document.querySelectorAll("a[data-app]").forEach(a => { a.removeAttribute("href"); a.setAttribute("aria-disabled", "true"); });
      document.getElementById("note").textContent = "Log in is not available yet: the app server is not configured (APP_URL).";
    }
  </script>
</body>
</html>
