<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pips Storage{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; margin:0; min-height:100vh; }
    header { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.5rem; border-bottom:1px solid #21262d; }
    header a.brand { color:#e6edf3; text-decoration:none; font-weight:600; }
    nav a { color:#58a6ff; text-decoration:none; margin-left:1rem; }
    main { max-width: 720px; margin: 2.5rem auto; padding: 0 1.5rem; }
    h1 { margin-top:0; }
    .card { border:1px solid #30363d; border-radius:10px; padding:1.25rem; margin-bottom:1rem; background:#0d1117; }
    .muted { color:#8b949e; font-size:.9rem; }
    label { display:block; margin:.75rem 0 .25rem; font-size:.9rem; color:#8b949e; }
    input[type=text], input[type=password], input[type=file] { width:100%; background:#161b22; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:.5rem .7rem; }
    .btn { display:inline-block; background:#238636; color:#fff; border:0; border-radius:6px; padding:.5rem 1rem; cursor:pointer; text-decoration:none; font-size:.95rem; }
    .btn.secondary { background:#21262d; color:#e6edf3; border:1px solid #30363d; }
    .btn.danger { background:#da3633; }
    .btn.small { padding:.3rem .6rem; font-size:.85rem; margin-left:.3rem; }
    .actions { display:flex; gap:.75rem; flex-wrap:wrap; margin-top:1rem; }
    table { width:100%; border-collapse:collapse; }
    td { padding:.5rem 0; border-top:1px solid #21262d; }
    .error { color:#f85149; margin:.75rem 0 0; }
    .ok { color:#3fb950; }
    #status { min-height:1.2em; margin-top:.5rem; }
  </style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('home') }}">Pips Storage</a>
  <nav>
    {% if user %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('signup') }}">Sign up</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
