<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private file storage</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; margin:0; padding:2rem; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .card { border:1px solid #30363d; border-radius:10px; padding:1rem 1.25rem; margin-bottom:1rem; }
    input[type=text], input[type=password] { background:#161b22; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:.4rem .6rem; width:100%; box-sizing:border-box; }
    button { background:#238636; color:#fff; border:0; border-radius:6px; padding:.45rem .9rem; cursor:pointer; margin-left:.4rem; }
    button.danger { background:#da3633; }
    button.ghost { background:#21262d; }
    table { width:100%; border-collapse:collapse; }
    td { padding:.45rem 0; border-top:1px solid #21262d; }
    .muted { color:#8b949e; font-size:.85rem; }
    #status { min-height:1.2em; margin-top:.5rem; }
    .ok { color:#3fb950; } .bad { color:#f85149; }
  </style>
</head>
<body>
<main>
  <h1>Private file storage</h1>
  <p class="muted">Files are stored in a private repository. Only the API reads or writes them.</p>

  <div class="card">
    <label class="muted" for="key">API key (needed to upload or delete; kept in this browser tab only)</label>
    <input id="key" type="password" autocomplete="off" placeholder="X-API-Key">
  </div>

  <div class="card">
    <input id="file" type="file">
    <button id="upload">Upload</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <table><tbody id="list"><tr><td class="muted">Loading…</td></tr></tbody></table>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const keyEl = $("key");
  keyEl.value = sessionStorage.getItem("apiKey") || "";
  keyEl.addEventListener("input", () => sessionStorage.setItem("apiKey", keyEl.value));

  function say(msg, cls) { const s = $("status"); s.textContent = msg; s.className = cls || ""; }

  async function readError(r) {
    try { return (await r.json()).error || r.statusText; } catch { return r.statusText; }
  }

  async function load() {
    const r = await fetch("/api/files");
    const tbody = $("list");
    if (!r.ok) { tbody.innerHTML = `<tr><td class="bad">${await readError(r)}</td></tr>`; return; }
    const { files } = await r.json();
    if (!files.length) { tbody.innerHTML = `<tr><td class="muted">No files yet.</td></tr>`; return; }
    tbody.innerHTML = "";
    for (const f of files) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td></td><td class="muted"></td><td style="text-align:right"></td>`;
      tr.children[0].textContent = f.name;
      tr.children[1].textContent = `${f.size} bytes`;
      const dl = document.createElement("button"); dl.className = "ghost"; dl.textContent = "Download";
      dl.onclick = () => download(f.name);
      const rm = document.createElement("button"); rm.className = "danger"; rm.textContent = "Delete";
      rm.onclick = () => remove(f.name);
      tr.children[2].append(dl, rm);
      tbody.append(tr);
    }
  }

  function authHeaders() {
    const k = keyEl.value.trim();
    return k ? { "X-API-Key": k } : {};
  }

  async function download(name) {
    const r = await fetch(`/api/files/${encodeURIComponent(name)}`);
    if (!r.ok) return say(await readError(r), "bad");
    const url = URL.createObjectURL(await r.blob());
    const a = Object.assign(document.createElement("a"), { href: url, download: name });
    a.click(); URL.revokeObjectURL(url);
  }

  async function remove(name) {
    if (!confirm(`Delete ${name}?`)) return;
    const r = await fetch(`/api/files/${encodeURIComponent(name)}`, { method: "DELETE", headers: authHeaders() });
    if (!r.ok) return say(await readError(r), "bad");
    say(`Deleted ${name}`, "ok"); load();
  }

  $("upload").onclick = async () => {
    const f = $("file").files[0];
    if (!f) return say("Choose a file first.", "bad");
    const fd = new FormData(); fd.append("file", f, f.name);
    const r = await fetch("/api/files", { method: "POST", headers: authHeaders(), body: fd });
    if (!r.ok) return say(await readError(r), "bad");
    say(`Uploaded ${f.name}`, "ok"); $("file").value = ""; load();
  };

  load();
</script>
</body>
</html>
